default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
-   repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
        -   id: conventional-pre-commit
            stages: [commit-msg]
            args: []
-   repo: local
    hooks:
        -   id: no-co-authored-by
            name: reject AI attribution lines
            language: pygrep
            entry: '^(co-authored-by:|([^\x00-\x7f]+ ?)?generated with )'
            args: [--ignore-case]
            stages: [commit-msg]
        -   id: check-harness
            name: check plugin manifests, skills and templates
            language: script
            entry: agents/check_harness.py
            pass_filenames: false
            always_run: true
        -   id: test-harness
            name: test the harness check
            language: system
            entry: python3 -B -m unittest discover -s tests
            pass_filenames: false
            always_run: true
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
        -   id: no-commit-to-branch
        -   id: check-executables-have-shebangs
        -   id: check-merge-conflict
        -   id: check-toml
        -   id: trailing-whitespace
        -   id: end-of-file-fixer
        -   id: check-yaml
        -   id: check-added-large-files
        -   id: check-case-conflict
        -   id: check-json
        -   id: check-merge-conflict
        -   id: check-symlinks
        -   id: pretty-format-json
            args:
                - --autofix
-   repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
        -   id: forbid-crlf
        -   id: remove-crlf
        -   id: forbid-tabs
        -   id: remove-tabs
-   repo: https://github.com/Lucas-C/pre-commit-hooks-markup
    rev: v1.0.0
    hooks:
        -   id: rst-linter
